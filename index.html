<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7EC">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <title>MonAsso — prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Outils de démonstration (rempli par js/app.js) : ne font pas partie de l'interface. -->
  <div class="demo" role="region" aria-label="Outils de démonstration">
    <div class="demo-bandeau">
      <span class="demo-etiquette" id="demo-etiquette">Prototype de test</span>
      <a class="demo-retour" id="demo-retour" href="#accueil" hidden>Revenir à l'application</a>
      <button type="button" class="demo-bouton" id="demo-ouvrir" aria-expanded="false" aria-controls="demo-menu">Démo</button>
    </div>
    <div class="demo-menu" id="demo-menu" hidden></div>
  </div>

  <main id="vue" class="vue" tabindex="-1"></main>

  <!-- Menu du bas (rempli par js/app.js selon la sorte de groupe). -->
  <nav class="onglets" id="onglets" aria-label="Menu principal"></nav>

  <noscript><p class="vue">Ce prototype a besoin de JavaScript pour fonctionner.</p></noscript>

  <script src="mots.js"></script>
  <script src="donnees.js"></script>
  <script src="js/logique.js"></script>
  <script src="js/groupes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
