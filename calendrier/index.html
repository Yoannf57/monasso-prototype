<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7EC">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Les Coquelicots — prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Outils de démonstration : ne font pas partie de l'interface. -->
  <div class="demo" role="region" aria-label="Outils de démonstration">
    <div class="demo-bandeau">
      <span class="demo-etiquette">Prototype v2 · calendrier</span>
      <a class="demo-retour" id="demo-retour" href="#accueil" hidden>Espace bureau</a>
      <button type="button" class="demo-bouton" id="demo-ouvrir" aria-expanded="false" aria-controls="demo-menu">Démo</button>
    </div>
    <div class="demo-menu" id="demo-menu" hidden>
      <label class="demo-ligne" for="demo-utilisateur">Je suis
        <select id="demo-utilisateur"></select>
      </label>
      <a class="demo-ligne" href="#inscription/vide-grenier">Voir l'espace parent (vide-grenier)</a>
      <button type="button" class="demo-ligne demo-reinit" data-reinitialiser>Réinitialiser la démo</button>
    </div>
  </div>

  <main id="vue" class="vue" tabindex="-1"></main>

  <nav class="onglets" id="onglets" aria-label="Menu principal">
    <a href="#accueil" data-onglet="accueil">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg></span>
      <span>Accueil</span>
    </a>
    <a href="#evenements" data-onglet="evenements">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span>Événements</span>
    </a>
    <a href="#association" data-onglet="association">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.5 14.3c2.4.1 4.1 1.8 4.5 4.7"/></svg></span>
      <span>Association</span>
    </a>
    <a href="#aide" data-onglet="aide">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.8v.6"/><path d="M12 17.2v.1"/></svg></span>
      <span>Aide</span>
    </a>
  </nav>

  <noscript><p class="vue">Ce prototype a besoin de JavaScript pour fonctionner.</p></noscript>

  <script src="donnees.js"></script>
  <script src="js/logique.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
